<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Falio App - İndir</title>
    <meta name="description" content="Falio : Astroloji, Rüya & Fal uygulamasını indir. Günlük burç yorumları, canlı fal ve astroloji rehberin.">
    <meta name="theme-color" content="#0a0a0d">

    <!-- Smart redirect based on platform -->
    <meta http-equiv="refresh" content="3;url=https://play.google.com/store/apps/details?id=com.veysel35.Falio">

    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
    <link rel="apple-touch-icon" href="../apple-touch-icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #a78bfa; --accent-2: #f5c451;
            --bg: #0a0a0d; --line: rgba(255, 255, 255, .09); --line-2: rgba(255, 255, 255, .16);
            --text: #f4f1ea; --text-2: #a9a8b3; --text-3: #6f6e7a; --signal: #d6ff3f;
            --ease: cubic-bezier(.22, 1, .36, 1);
            --font: 'Bricolage Grotesque', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.55;
            min-height: 100svh; display: flex; align-items: center; justify-content: center;
            padding: max(1.25rem, env(safe-area-inset-top)) 1.1rem max(1.25rem, env(safe-area-inset-bottom));
            overflow-x: hidden; position: relative; isolation: isolate; -webkit-font-smoothing: antialiased;
        }
        body::before {
            content: ''; position: fixed; inset: 0; z-index: -1;
            background:
                radial-gradient(620px 420px at 12% 8%, color-mix(in srgb, var(--accent) 38%, transparent), transparent 70%),
                radial-gradient(640px 460px at 92% 92%, color-mix(in srgb, var(--accent-2) 26%, transparent), transparent 70%),
                linear-gradient(var(--line) 1px, transparent 1px) 0 0 / 64px 64px,
                linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0 / 64px 64px;
            -webkit-mask-image: radial-gradient(ellipse 90% 80% at 50% 45%, #000 30%, rgba(0,0,0,.35) 100%);
            mask-image: radial-gradient(ellipse 90% 80% at 50% 45%, #000 30%, rgba(0,0,0,.35) 100%);
        }
        a { color: inherit; text-decoration: none; }
        :focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; border-radius: 8px; }
        .redirect-container {
            width: min(440px, 100%); text-align: center; padding: 2rem 1.5rem 1.6rem; border-radius: 32px;
            background: linear-gradient(180deg, rgba(24, 24, 31, .86), rgba(14, 14, 19, .9));
            border: 1px solid var(--line-2);
            -webkit-backdrop-filter: blur(22px); backdrop-filter: blur(22px);
            box-shadow: 0 50px 100px -40px rgba(0, 0, 0, .9);
            animation: rise .9s var(--ease) both; position: relative;
        }
        .redirect-container::before { content: ''; position: absolute; left: 12%; right: 12%; top: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--accent), var(--accent-2), transparent); }
        @keyframes rise { from { opacity: 0; transform: translateY(26px) scale(.985); } to { opacity: 1; transform: none; } }
        .icon-wrap { position: relative; width: 108px; height: 108px; margin: 0 auto 1.4rem; }
        .icon-wrap::before { content: ''; position: absolute; inset: -22px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--accent) 55%, transparent), transparent 68%); filter: blur(10px); animation: halo 4s ease-in-out infinite; }
        @keyframes halo { 0%, 100% { opacity: .55; transform: scale(.95); } 50% { opacity: .95; transform: scale(1.08); } }
        .app-icon { position: relative; width: 100%; height: 100%; border-radius: 27%; object-fit: cover; border: 1px solid var(--line-2); box-shadow: 0 24px 50px -18px var(--accent); }
        h1 { font-size: clamp(1.6rem, 6vw, 2rem); font-weight: 700; letter-spacing: -.03em; line-height: 1.1; margin-bottom: .6rem; }
        .subtitle { color: var(--text-2); font-size: 1rem; margin-bottom: 1.5rem; }
        .status { display: flex; align-items: center; gap: .85rem; text-align: left; padding: .85rem 1rem; border-radius: 18px; background: rgba(255, 255, 255, .035); border: 1px solid var(--line); margin-bottom: 1rem; }
        .spinner { width: 22px; height: 22px; flex: none; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .14); border-top-color: var(--signal); animation: spin .9s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .redirect-text { color: var(--text-2); font-size: .86rem; }
        .manual-link {
            display: flex; align-items: center; justify-content: center; gap: .8rem; padding: .95rem 1.1rem; border-radius: 18px;
            background: linear-gradient(135deg, var(--accent), #7c5cf0); font-weight: 650; font-size: 1.05rem;
            box-shadow: 0 18px 40px -16px var(--accent); transition: transform .35s var(--ease), box-shadow .35s;
        }
        .manual-link:hover { transform: translateY(-3px); box-shadow: 0 24px 50px -14px var(--accent); }
        .manual-link svg { width: 24px; height: 24px; fill: #fff; flex: none; }
        .back-link { display: inline-block; margin-top: 1.3rem; padding-top: 1rem; width: 100%; border-top: 1px solid var(--line); color: var(--text-3); font-size: .86rem; transition: color .25s; }
        .back-link:hover { color: var(--text); }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
    </style>
</head>
<body>
    <div class="redirect-container">
        <div class="icon-wrap">
            <img src="../assets/icon-falio.webp" alt="Falio App" class="app-icon" width="108" height="108">
        </div>
        <h1>Falio : Astroloji, Rüya &amp; Fal</h1>
        <p class="subtitle" id="subtitle">Uygulama mağazasına yönlendiriliyorsunuz...</p>
        <div class="status">
            <div class="spinner"></div>
            <p class="redirect-text" id="redirect-text">Otomatik yönlendirme çalışmazsa aşağıdaki butona dokunun</p>
        </div>
        <a href="https://play.google.com/store/apps/details?id=com.veysel35.Falio" class="manual-link" id="store-link">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.609 1.814L13.792 12 3.61 22.186a.996.996 0 0 1-.61-.92V2.734a1 1 0 0 1 .609-.92zm10.89 10.893l2.302 2.302-10.937 6.333 8.635-8.635zm3.199-1.04l2.28 1.319a1 1 0 0 1 0 1.728l-2.28 1.319-2.529-2.529 2.529-2.837zM5.864 2.658L16.8 8.99l-2.302 2.302-8.635-8.635z"/></svg>
            <span id="store-text">Google Play'de Aç</span>
        </a>
        <a href="../" class="back-link" id="back-link">← VB TECH LABS'a Dön</a>
    </div>

    <script>
        (function() {
            var playStore = 'https://play.google.com/store/apps/details?id=com.veysel35.Falio';
            // var appStore = 'https://apps.apple.com/app/falio'; // App Store link gelince eklenecek

            // English text for non-Turkish browsers
            var lang = (navigator.language || 'tr').toLowerCase();
            var saved = null;
            try { saved = localStorage.getItem('preferredLanguage'); } catch (e) {}
            if (saved === 'en' || (!saved && lang.indexOf('tr') !== 0)) {
                document.documentElement.lang = 'en';
                document.getElementById('subtitle').textContent = 'Redirecting you to the app store...';
                document.getElementById('redirect-text').textContent = 'If it does not open automatically, tap the button below';
                document.getElementById('store-text').textContent = 'Open on Google Play';
                document.getElementById('back-link').textContent = '← Back to VB TECH LABS';
            }

            // Herkesi Play Store'a yönlendir
            setTimeout(function() {
                window.location.href = playStore;
            }, 2000);
        })();
    </script>
</body>
</html>
